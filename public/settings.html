<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Настройки — Тепло</title>

<style>
:root{--bg:#010003;--card:#0b0b0e;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);--text:#fff;--muted:#c7c7c7;--dim:#5f5f68;--pink:#ff2164;--mag:#fb3dff;--pur:#9b23ea;--blue:#5f72bd;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Lato',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle 500px at 15% -10%,rgba(255,33,100,.09),transparent 70%),radial-gradient(circle 400px at 90% 110%,rgba(155,35,234,.08),transparent 70%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 18px 40px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--mag));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 4px 16px rgba(255,33,100,.4)}
.bname{font-size:15px;font-weight:900;letter-spacing:-.01em}
.bsub{font-size:10px;color:var(--dim);font-family:'Roboto Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.me{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:100px;font-size:13px;font-weight:700}
.section{margin-bottom:22px}
.slabel{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;font-family:'Roboto Mono',monospace;display:flex;align-items:center;gap:8px}
.slabel::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.settings-item{display:flex;align-items:center;gap:14px;width:100%;padding:18px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);transition:all .25s var(--ease);margin-bottom:10px}
.settings-item:active{transform:scale(.98);background:var(--bg)}
.si-icon{font-size:26px;line-height:1;flex-shrink:0}
.si-info{flex:1;min-width:0}
.si-title{font-size:15px;font-weight:900;color:var(--text);margin-bottom:2px}
.si-sub{font-size:12px;color:var(--dim);line-height:1.3}
.si-arrow{font-size:18px;color:var(--dim);flex-shrink:0}
.footer-info{margin-top:36px;text-align:center;font-size:11px;color:var(--dim);font-family:'Roboto Mono',monospace;letter-spacing:.05em}
.footer-info a{color:var(--pink);text-decoration:none}
</style>
</head>
<body class="theme-wine hide-header-btns">
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div class="bname">ТЕПЛО</div>
        <div class="bsub">settings</div>
      </div>
    </div>
    <div class="me"><span id="meE">🦊</span> <span id="meN">—</span></div>
  </div>

  <div class="section">
    <div class="slabel">Настройки</div>

    <button class="settings-item" onclick="profileOpen()">
      <span class="si-icon">👤</span>
      <div class="si-info">
        <div class="si-title">Профиль</div>
        <div class="si-sub">Имя, emoji, свои кнопки</div>
      </div>
      <span class="si-arrow">→</span>
    </button>

    

    <button class="settings-item" onclick="location.href='faq.html' + (location.search || '')"><span class="si-icon">❓</span><div class="si-info"><div class="si-title">Частые вопросы</div><div class="si-sub">Помощь и ответы на всё</div></div><span class="si-arrow">→</span></button><button class="settings-item" onclick="openChangelogLog()">
      <span class="si-icon">📜</span>
      <div class="si-info">
        <div class="si-title">История обновлений</div>
        <div class="si-sub">Что нового в проекте</div>
      </div>
      <span class="si-arrow">→</span>
    </button>
  </div>

  <div class="footer-info">
    Тепло · <a href="https://t.me/aSp1rit" target="_blank" rel="noopener">by @aSp1rit</a>
  </div>
</div>

<script src="/bg-anim.js?v=1790952940"></script>
<script src="/theme.js?v=1790984522"></script>
<script src="/profile.js?v=1790952940"></script>
<script src="/changelog-log.js?v=1790952940"></script>
<script src="/tabbar.js?v=1790963082"></script>
<script src="/visual.js?v=1790982251"></script></body>
</html>
