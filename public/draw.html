<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#010003">
<title>Рисование</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#010003;--card:#0b0b0e;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);--text:#fff;--dim:#5f5f68;--pink:#ff2164;--mag:#fb3dff;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Lato',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px;border-bottom:1px solid var(--border);background:rgba(1,0,3,.85);backdrop-filter:blur(12px);z-index:10}
.ib{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s var(--ease);font-family:inherit}
.ib:active{transform:scale(.92)}
.ib.active{background:linear-gradient(145deg,var(--pink),var(--mag));border-color:transparent;box-shadow:0 0 20px rgba(255,33,100,.4)}
.title{font-size:14px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-family:'Roboto Mono',monospace;color:#c7c7c7}
.cw{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
#canvas{background:#0a0a0d;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 20px 60px rgba(0,0,0,.6);touch-action:none;cursor:crosshair;max-width:100%;max-height:100%}
.tb{padding:12px 16px 16px;border-top:1px solid var(--border);background:rgba(1,0,3,.9);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px}
.tr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.colors{display:flex;gap:8px;flex:1;justify-content:center}
.col{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s var(--ease);padding:0}
.col:active{transform:scale(.9)}
.col.active{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.sizes{display:flex;gap:8px;align-items:center;justify-content:center;flex:1}
.sz{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease);padding:0}
.sz:active{transform:scale(.9)}
.sz.active{border-color:var(--pink);background:rgba(255,33,100,.12);box-shadow:0 0 14px rgba(255,33,100,.25)}
.sd{background:#fff;border-radius:50%}
.ba{display:flex;gap:10px}
.btn{flex:1;padding:16px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.96)}
.bs{background:linear-gradient(145deg,var(--pink),var(--mag));box-shadow:0 8px 24px rgba(255,33,100,.35)}
.bs:disabled{opacity:.4;pointer-events:none}
.b2{background:var(--card);border:1.5px solid var(--border2);flex:0 0 auto;padding:16px 20px}
.pick{position:fixed;inset:0;background:rgba(1,0,3,.9);backdrop-filter:blur(14px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.pick.show{display:flex}
.pc{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:24px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:pi .4s var(--ease)}
@keyframes pi{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.pt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-family:'Roboto Mono',monospace;margin-bottom:16px;text-align:center}
.pl{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;transition:all .25s var(--ease)}
.pitem:active{transform:scale(.97)}
.pitem.active{border-color:var(--pink);background:rgba(255,33,100,.08)}
.pitem .em{font-size:22px}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-130%);padding:14px 22px;background:#fff;color:#0a0a0a;border-radius:14px;font-weight:700;font-size:14px;z-index:1000;max-width:calc(100vw - 40px);transition:transform .5s var(--ease),opacity .3s;opacity:0;box-shadow:0 20px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.error{background:#ff2164;color:#fff}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:999;animation:sf .9s var(--ease) forwards}
@keyframes sf{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
</style>
<link rel="manifest" href="/manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/icon-192.svg"><link rel="icon" type="image/svg+xml" href="/icon-192.svg"></head>
<body>
<div class="toast" id="toast"><span id="toastIc">✅</span><span id="toastText"></span></div>
<div class="top">
<button class="ib" onclick="goBack()">←</button>
<div class="title">Рисование</div>
<div style="display:flex;gap:8px">
<button class="ib" id="undoBtn" onclick="undo()">↶</button>
<button class="ib" onclick="clearCanvas(true)">🗑</button>
</div>
</div>
<div class="cw"><canvas id="canvas"></canvas></div>
<div class="tb">
<div class="tr"><div class="colors" id="colors"></div></div>
<div class="tr">
<div class="sizes" id="sizes"></div>
<button class="ib" id="eraserBtn" onclick="toggleEraser()">🧽</button>
</div>
<div class="ba">
<button class="btn b2" onclick="openPicker()"><span id="rEmoji">🌸</span><span id="rName">Аня</span></button>
<button class="btn bs" id="sendBtn" onclick="sendDraw()">📤 Отправить</button>
</div>
</div>
<div class="pick" id="picker"><div class="pc"><div class="pt">Кому отправить</div><div class="pl" id="pickerList"></div></div></div>
<script>
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d');
const LS_T='teplo_token_v1';
let myToken=null,allUsers=[],recipient=null;
const COLORS=['#ffffff','#ff2164','#fb3dff','#9b23ea','#5f72bd','#c7c7c7','#000000'];
const SIZES=[2,5,12,24];
let curColor='#ffffff',curSize=5,isEraser=false,drawing=false,histStack=[],lastPos=null;
async function init(){
  const p=new URLSearchParams(location.search),ut=p.get('token');
  myToken=ut||localStorage.getItem(LS_T);
  if(!myToken){ts('Нужна ссылка',1);return}
  try{const r=await fetch('/api/users?token='+encodeURIComponent(myToken));allUsers=(await r.json()).users||[]}catch(e){allUsers=[]}
  if(!allUsers.length){ts('Нет пользователей',1);return}
  const saved=localStorage.getItem('teplo_draw_recipient');
  recipient=allUsers.find(u=>u.id===saved)||allUsers[0];
  updateRecUI();setupCanvas();renderColors();renderSizes();openPicker();
}
function setupCanvas(){
  const w=cv.parentElement.getBoundingClientRect();
  const size=Math.min(w.width-20,w.height-20);
  const dpr=window.devicePixelRatio||1;
  cv.style.width=size+'px';cv.style.height=size+'px';
  cv.width=size*dpr;cv.height=size*dpr;
  ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
  clearCanvas(false);saveState();
  cv.addEventListener('pointerdown',start);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointerleave',end);
  cv.addEventListener('pointercancel',end);
}
const getPos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function start(e){
  e.preventDefault();drawing=true;lastPos=getPos(e);
  ctx.beginPath();
  ctx.arc(lastPos.x,lastPos.y,(isEraser?curSize*2:curSize)/2,0,Math.PI*2);
  ctx.fillStyle=isEraser?'#0a0a0d':curColor;ctx.fill();
  cv.setPointerCapture(e.pointerId);
}
function move(e){
  if(!drawing)return;e.preventDefault();
  const pos=getPos(e);
  ctx.beginPath();ctx.moveTo(lastPos.x,lastPos.y);ctx.lineTo(pos.x,pos.y);
  ctx.strokeStyle=isEraser?'#0a0a0d':curColor;
  ctx.lineWidth=isEraser?curSize*2:curSize;
  ctx.stroke();lastPos=pos;
}
function end(e){if(!drawing)return;drawing=false;lastPos=null;saveState()}
function saveState(){histStack.push(cv.toDataURL('image/png'));if(histStack.length>20)histStack.shift();document.getElementById('undoBtn').style.opacity=histStack.length>1?'1':'0.4'}
function undo(){
  if(histStack.length<=1)return;
  histStack.pop();
  const img=new Image();
  img.onload=()=>{ctx.clearRect(0,0,cv.width,cv.height);const dpr=window.devicePixelRatio||1;ctx.drawImage(img,0,0,cv.width/dpr,cv.height/dpr)};
  img.src=histStack[histStack.length-1];
  document.getElementById('undoBtn').style.opacity=histStack.length>1?'1':'0.4';
  vib(8);
}
function clearCanvas(confirmFirst){
  if(confirmFirst&&!confirm('Очистить холст?'))return;
  const dpr=window.devicePixelRatio||1;
  ctx.fillStyle='#0a0a0d';ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  if(confirmFirst){histStack=[];saveState();vib(15)}
}
function renderColors(){
  const box=document.getElementById('colors');box.innerHTML='';
  COLORS.forEach(c=>{
    const b=document.createElement('button');
    b.className='col'+(c===curColor&&!isEraser?' active':'');
    b.style.background=c;
    if(c==='#000000')b.style.border='1px solid rgba(255,255,255,.25)';
    b.onclick=()=>{curColor=c;isEraser=false;updateEr();renderColors();renderSizes();vib(5)};
    box.appendChild(b);
  });
}
function renderSizes(){
  const box=document.getElementById('sizes');box.innerHTML='';
  SIZES.forEach(s=>{
    const b=document.createElement('button');
    b.className='sz'+(s===curSize?' active':'');
    const d=document.createElement('div');d.className='sd';
    const ds=Math.min(20,Math.max(4,s*0.9));
    d.style.width=ds+'px';d.style.height=ds+'px';d.style.background=curColor;
    b.appendChild(d);
    b.onclick=()=>{curSize=s;renderSizes();vib(5)};
    box.appendChild(b);
  });
}
function toggleEraser(){isEraser=!isEraser;updateEr();renderColors();vib(8)}
function updateEr(){document.getElementById('eraserBtn').classList.toggle('active',isEraser)}
function updateRecUI(){document.getElementById('rEmoji').textContent=recipient.emoji;document.getElementById('rName').textContent=recipient.name}
function openPicker(){
  const box=document.getElementById('pickerList');box.innerHTML='';
  allUsers.forEach(u=>{
    const b=document.createElement('button');
    b.className='pitem'+(recipient&&u.id===recipient.id?' active':'');
    b.innerHTML=`<span class="em">${u.emoji}</span><span>${u.name}</span>`;
    b.onclick=()=>{recipient=u;localStorage.setItem('teplo_draw_recipient',u.id);updateRecUI();closePicker();vib(8)};
    box.appendChild(b);
  });
  document.getElementById('picker').classList.add('show');
}
function closePicker(){document.getElementById('picker').classList.remove('show')}
document.getElementById('picker').addEventListener('click',e=>{if(e.target.id==='picker')closePicker()});
async function sendDraw(){
  if(!recipient)return ts('Выбери получателя',1);
  if(!recipient.ready)return ts(recipient.name+' не подключён',1);
  const btn=document.getElementById('sendBtn');btn.disabled=true;
  ts('Отправляю рисунок...',0,'🎨');
  cv.toBlob(async blob=>{
    if(!blob){ts('Ошибка',1);btn.disabled=false;return}
    try{
      const file=new File([blob],'drawing.png',{type:'image/png'});
      const fd=new FormData();
      fd.append('photo',file);fd.append('token',myToken);fd.append('to',recipient.id);
      fd.append('kind','drawing');fd.append('caption','🎨 рисунок для тебя');
      const r=await fetch('/api/send-photo',{method:'POST',body:fd});
      const d=await r.json();if(!d.ok)throw new Error(d.error);
      ts('Рисунок отправлен '+recipient.name,0,'💖');
      sparks(window.innerWidth/2,window.innerHeight/2);
      vib([20,50,20,50,20]);btn.disabled=false;
    }catch(e){ts(e.message||'Ошибка',1);btn.disabled=false}
  },'image/png');
}
function goBack(){location.href='index.html?token='+encodeURIComponent(myToken)}
const toast=document.getElementById('toast');
function ts(text,err,icon){document.getElementById('toastText').textContent=text;document.getElementById('toastIc').textContent=icon||(err?'⚠️':'✅');toast.classList.toggle('error',!!err);toast.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>toast.classList.remove('show'),2500)}
function sparks(x,y){
  const c=['#ff2164','#fb3dff','#9b23ea','#5f72bd','#fff'];
  for(let i=0;i<18;i++){
    const s=document.createElement('div');s.className='spark';
    s.style.left=x+'px';s.style.top=y+'px';s.style.background=c[i%c.length];s.style.boxShadow='0 0 10px '+c[i%c.length];
    const a=(Math.PI*2*i)/18+Math.random()*0.3,d=100+Math.random()*150;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.animationDelay=(Math.random()*0.1)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),1200);
  }
}
function vib(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
init();
</script>
