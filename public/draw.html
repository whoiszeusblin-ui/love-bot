<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#010003">
<title>Рисование — Тепло</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/themes.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Lato',system-ui,sans-serif;
  background:var(--bg,#010003);
  color:var(--text,#fff);
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
.top{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;
  gap:8px;
  background:var(--card,#0b0b0e);
  border-bottom:1px solid var(--border,rgba(255,255,255,.07));
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  position:relative;z-index:10;
}
.ib{
  width:40px;height:40px;border-radius:10px;
  background:var(--bg,#010003);
  border:1px solid var(--border,rgba(255,255,255,.1));
  color:var(--text,#fff);
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;padding:0;
  transition:transform .15s ease;
}
.ib:active{transform:scale(.9)}
.ib.active{background:linear-gradient(145deg,var(--pink,#ff2164),var(--mag,#fb3dff));border-color:transparent;box-shadow:0 0 16px var(--fire-glow,rgba(255,33,100,.4))}
.title{font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-family:'Roboto Mono',monospace;color:var(--muted,#c7c7c7)}
.top-actions{display:flex;gap:8px}

/* ===== ХОЛСТ ===== */
.cw{
  flex:1 1 0;
  min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:8px;
  overflow:hidden;
  position:relative;
}
#canvas{
  background:#0a0a0d;
  border-radius:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 12px 40px rgba(0,0,0,.5);
  touch-action:none;
  cursor:crosshair;
  display:block;
}

/* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
.tb{
  flex-shrink:0;
  padding:10px 12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--card,#0b0b0e);
  border-top:1px solid var(--border,rgba(255,255,255,.07));
  display:flex;flex-direction:column;gap:10px;
  position:relative;z-index:10;
}
.tr{display:flex;align-items:center;gap:10px}

.colors{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.col{
  width:34px;height:34px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;padding:0;
  transition:transform .2s ease,border-color .2s ease;
}
.col:active{transform:scale(.9)}
.col.active{border-color:var(--text,#fff);transform:scale(1.12);box-shadow:0 0 0 2px rgba(255,255,255,.15)}

.sizes{display:flex;gap:8px;flex:1;justify-content:center;align-items:center}
.sz{
  width:38px;height:38px;border-radius:10px;
  background:var(--bg,#010003);
  border:1px solid var(--border,rgba(255,255,255,.1));
  cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.sz:active{transform:scale(.9)}
.sz.active{border-color:var(--pink,#ff2164);background:rgba(255,33,100,.12);box-shadow:0 0 12px var(--fire-glow,rgba(255,33,100,.3))}
.sd{background:var(--text,#fff);border-radius:50%}

.ba{display:flex;gap:8px}
.btn{
  flex:1;padding:14px;border-radius:12px;border:none;
  font-family:inherit;font-size:14px;font-weight:900;
  cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s ease;
}
.btn:active{transform:scale(.96)}
.bs{background:linear-gradient(145deg,var(--pink,#ff2164),var(--mag,#fb3dff));box-shadow:0 6px 18px var(--fire-glow,rgba(255,33,100,.35))}
.b2{background:var(--bg,#010003);border:1.5px solid var(--border2,rgba(255,255,255,.14));flex:0 0 auto;padding:14px 16px;font-size:13px;color:var(--text,#fff)}

/* ===== PICKER ПОЛУЧАТЕЛЯ ===== */
.pick{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
.pick.show{display:flex}
.pc{background:linear-gradient(145deg,var(--card,#0b0b0e),var(--bg,#010003));border:1.5px solid var(--border2,rgba(255,255,255,.14));border-radius:20px;padding:22px;max-width:380px;width:100%;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.pt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim,#5f5f68);font-family:'Roboto Mono',monospace;margin-bottom:14px;text-align:center}
.pl{display:flex;flex-direction:column;gap:8px}
.pitem{padding:14px 16px;border-radius:12px;background:var(--bg,#010003);border:1.5px solid var(--border,rgba(255,255,255,.1));color:var(--text,#fff);cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;text-align:left;display:flex;align-items:center;gap:12px}
.pitem.active{border-color:var(--pink,#ff2164);background:rgba(255,33,100,.08)}

/* ===== TOAST ===== */
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);padding:12px 20px;background:#fff;color:#0a0a0a;border-radius:12px;font-weight:700;font-size:14px;z-index:1000;max-width:calc(100vw - 32px);transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;box-shadow:0 16px 40px rgba(0,0,0,.5);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.error{background:#ff2164;color:#fff}

/* ===== ВОДЯНОЙ ЗНАК ===== */
.wm{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:8px;font-size:9px;font-family:'Roboto Mono',monospace;color:rgba(255,255,255,.25);text-decoration:none;letter-spacing:.05em;z-index:5;pointer-events:auto}
</style>
</head>
<body class="theme-wine">
<div class="toast" id="toast"></div>

<div class="top">
  <button class="ib" onclick="goBack()">←</button>
  <div class="title">Рисование</div>
  <div class="top-actions">
    <button class="ib" id="undoBtn" onclick="undo()" style="opacity:.4">↶</button>
    <button class="ib" onclick="clearCanvas(true)">🗑</button>
  </div>
</div>

<div class="cw"><canvas id="canvas"></canvas></div>

<div class="tb">
  <div class="tr"><div class="colors" id="colors"></div></div>
  <div class="tr">
    <div class="sizes" id="sizes"></div>
    <button class="ib" id="eraserBtn" onclick="toggleEraser()">🧽</button>
  </div>
  <div class="ba">
    <button class="btn b2" onclick="openPicker()"><span id="rEmoji">🌸</span><span id="rName">—</span></button>
    <button class="btn bs" id="sendBtn" onclick="sendDraw()">📤 Отправить</button>
  </div>
</div>

<div class="pick" id="picker"><div class="pc"><div class="pt">Кому отправить</div><div class="pl" id="pickerList"></div></div></div>
<a class="wm" href="https://t.me/aSp1rit" target="_blank" rel="noopener">by @aSp1rit</a>

<script src="/theme.js"></script>
<script>
const cv = document.getElementById('canvas');
const ctx = cv.getContext('2d');
const LS_T = 'teplo_token_v1';
const COLORS = ['#ffffff','#ff2164','#fb3dff','#9b23ea','#5f72bd','#c7c7c7','#000000'];
const SIZES = [2,5,12,24];

let myToken = null;
let allUsers = [];
let recipient = null;
let curColor = '#ffffff';
let curSize = 5;
let isEraser = false;
let drawing = false;
let histStack = [];
let lastPos = null;

/* ===== ЗАПУСК ===== */
async function init(){
  const p = new URLSearchParams(location.search);
  const ut = p.get('token');
  myToken = ut || localStorage.getItem(LS_T);
  if (!myToken) { toast('Нужна ссылка', true); return; }

  try {
    const r = await fetch('/api/users?token=' + encodeURIComponent(myToken));
    allUsers = (await r.json()).users || [];
  } catch(e){ allUsers = []; }

  if (!allUsers.length) { toast('Нет пользователей', true); return; }

  const saved = localStorage.getItem('teplo_draw_recipient');
  recipient = allUsers.find(u => u.id === saved) || allUsers[0];
  updateRecUI();

  setupCanvas();
  renderColors();
  renderSizes();
  openPicker();
}

/* ===== ХОЛСТ ===== */
function setupCanvas(){
  const wrap = cv.parentElement;
  const wr = wrap.getBoundingClientRect();
  // отступы внутри .cw (padding 8)
  const availW = wr.width - 16;
  const availH = wr.height - 16;
  const size = Math.max(100, Math.min(availW, availH));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  cv.style.width = size + 'px';
  cv.style.height = size + 'px';
  cv.width = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  clearCanvas(false);
  saveState();

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointerleave', end);
  cv.addEventListener('pointercancel', end);
}

function getPos(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function start(e){
  e.preventDefault();
  drawing = true;
  lastPos = getPos(e);
  ctx.beginPath();
  const w = isEraser ? curSize * 2 : curSize;
  ctx.arc(lastPos.x, lastPos.y, w / 2, 0, Math.PI * 2);
  ctx.fillStyle = isEraser ? '#0a0a0d' : curColor;
  ctx.fill();
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
}
function move(e){
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastPos.x, lastPos.y);
  ctx.lineTo(pos.x, pos.y);
  ctx.strokeStyle = isEraser ? '#0a0a0d' : curColor;
  ctx.lineWidth = isEraser ? curSize * 2 : curSize;
  ctx.stroke();
  lastPos = pos;
}
function end(){ if (!drawing) return; drawing = false; lastPos = null; saveState(); }

function saveState(){
  try {
    histStack.push(cv.toDataURL('image/png'));
    if (histStack.length > 20) histStack.shift();
    document.getElementById('undoBtn').style.opacity = histStack.length > 1 ? '1' : '.4';
  } catch(e){}
}
function undo(){
  if (histStack.length <= 1) return;
  histStack.pop();
  const img = new Image();
  img.onload = function(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.restore();
    ctx.drawImage(img, 0, 0, cv.width / dpr, cv.height / dpr);
  };
  img.src = histStack[histStack.length - 1];
  document.getElementById('undoBtn').style.opacity = histStack.length > 1 ? '1' : '.4';
  vibrate(8);
}
function clearCanvas(confirmFirst){
  if (confirmFirst && !confirm('Очистить холст?')) return;
  const size = parseInt(cv.style.width, 10) || 300;
  ctx.fillStyle = '#0a0a0d';
  ctx.fillRect(0, 0, size, size);
  if (confirmFirst) { histStack = []; saveState(); vibrate(15); }
}

/* ===== ЦВЕТА И ТОЛЩИНЫ ===== */
function renderColors(){
  const box = document.getElementById('colors');
  box.innerHTML = '';
  COLORS.forEach(function(c){
    const b = document.createElement('button');
    b.className = 'col' + (c === curColor && !isEraser ? ' active' : '');
    b.style.background = c;
    if (c === '#000000') b.style.border = '1px solid rgba(255,255,255,.3)';
    b.onclick = function(){
      curColor = c;
      isEraser = false;
      updateEr();
      renderColors();
      renderSizes();
      vibrate(5);
    };
    box.appendChild(b);
  });
}
function renderSizes(){
  const box = document.getElementById('sizes');
  box.innerHTML = '';
  SIZES.forEach(function(s){
    const b = document.createElement('button');
    b.className = 'sz' + (s === curSize ? ' active' : '');
    const dot = document.createElement('div');
    dot.className = 'sd';
    const ds = Math.min(20, Math.max(4, s * 0.9));
    dot.style.width = ds + 'px';
    dot.style.height = ds + 'px';
    dot.style.background = curColor;
    b.appendChild(dot);
    b.onclick = function(){ curSize = s; renderSizes(); vibrate(5); };
    box.appendChild(b);
  });
}
function toggleEraser(){
  isEraser = !isEraser;
  updateEr();
  renderColors();
  vibrate(8);
}
function updateEr(){
  document.getElementById('eraserBtn').classList.toggle('active', isEraser);
}

/* ===== ПОЛУЧАТЕЛЬ ===== */
function updateRecUI(){
  document.getElementById('rEmoji').textContent = recipient.emoji;
  document.getElementById('rName').textContent = recipient.name;
}
function openPicker(){
  const box = document.getElementById('pickerList');
  box.innerHTML = '';
  allUsers.forEach(function(u){
    const b = document.createElement('button');
    b.className = 'pitem' + (recipient && u.id === recipient.id ? ' active' : '');
    b.innerHTML = '<span style="font-size:20px">' + u.emoji + '</span><span>' + u.name + '</span>';
    b.onclick = function(){
      recipient = u;
      localStorage.setItem('teplo_draw_recipient', u.id);
      updateRecUI();
      closePicker();
      vibrate(8);
    };
    box.appendChild(b);
  });
  document.getElementById('picker').classList.add('show');
}
function closePicker(){ document.getElementById('picker').classList.remove('show'); }
document.getElementById('picker').addEventListener('click', function(e){
  if (e.target.id === 'picker') closePicker();
});

/* ===== ОТПРАВКА ===== */
function sendDraw(){
  if (!recipient) { toast('Выбери получателя', true); return; }
  if (!recipient.ready) { toast(recipient.name + ' не подключён', true); return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'Отправляю...';
  toast('Готовлю рисунок...', false);

  cv.toBlob(function(blob){
    if (!blob) { toast('Ошибка', true); btn.disabled = false; btn.textContent = '📤 Отправить'; return; }
    const file = new File([blob], 'drawing.png', { type: 'image/png' });
    const fd = new FormData();
    fd.append('photo', file);
    fd.append('token', myToken);
    fd.append('to', recipient.id);
    fd.append('kind', 'drawing');
    fd.append('caption', '🎨 рисунок для тебя');

    fetch('/api/send-photo', { method: 'POST', body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) throw new Error(d.error || 'Ошибка');
        toast('Рисунок отправлен ' + recipient.name, false);
        vibrate([20,50,20,50,20]);
        btn.disabled = false;
        btn.textContent = '📤 Отправить';
      })
      .catch(function(e){
        toast('❌ ' + e.message, true);
        btn.disabled = false;
        btn.textContent = '📤 Отправить';
      });
  }, 'image/png');
}

/* ===== УТИЛИТЫ ===== */
function goBack(){ location.href = 'index.html?token=' + encodeURIComponent(myToken); }
const toastEl = document.getElementById('toast');
function toast(text, err){
  toastEl.textContent = text;
  toastEl.classList.toggle('error', !!err);
  toastEl.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2500);
}
function vibrate(p){ if (navigator.vibrate) try { navigator.vibrate(p); } catch(e){} }

/* ===== ПЕРЕСЧЁТ ПРИ РЕСАЙЗЕ / ОРИЕНТАЦИИ ===== */
let resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    // Просто перерисовываем размеры — состояние холста не сохраняем
    // (это компромисс: при повороте рисунок сбросится, но зато вёрстка правильная)
  }, 300);
});

init();
</script>
</body>
