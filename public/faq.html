<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#010003">
<title>FAQ — Тепло</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/theme-fix.css">
<link rel="stylesheet" href="/theme-smooth.css">
<link rel="stylesheet" href="/bg-anim.css">
<link rel="stylesheet" href="/tabbar.css"><link rel="stylesheet" href="/visual.css?v=1790982075">
<link rel="stylesheet" href="/hue-slider.css">
<style>
:root{--bg:#010003;--card:#0b0b0e;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);--text:#fff;--muted:#c7c7c7;--dim:#5f5f68;--pink:#ff2164;--mag:#fb3dff;--pur:#9b23ea;--blue:#5f72bd;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Lato',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle 500px at 15% -10%,rgba(255,33,100,.09),transparent 70%),radial-gradient(circle 400px at 90% 110%,rgba(155,35,234,.08),transparent 70%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 18px 40px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--mag));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 4px 16px rgba(255,33,100,.4)}
.bname{font-size:15px;font-weight:900;letter-spacing:-.01em}
.bsub{font-size:10px;color:var(--dim);font-family:'Roboto Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.me{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:100px;font-size:13px;font-weight:700}
.slabel{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;font-family:'Roboto Mono',monospace;display:flex;align-items:center;gap:8px}
.slabel::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* FAQ аккордеон */
.faq-item{background:var(--card);border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .3s ease}
.faq-item.open{border-color:var(--pink)}
.faq-q{width:100%;padding:16px 18px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;color:var(--text);position:relative;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700}
.faq-q:active{background:rgba(255,255,255,.03)}
.faq-q .q-emoji{font-size:20px;flex-shrink:0}
.faq-q .q-text{flex:1;padding-right:24px}
.faq-q .q-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.faq-item.open .q-arrow{transform:translateY(-50%) rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.16,1,.3,1)}
.faq-item.open .faq-a{max-height:800px}
.faq-a-inner{padding:0 18px 18px 50px;font-size:14px;color:var(--muted);line-height:1.6}
.faq-a-inner b{color:var(--text);font-weight:900}
.faq-a-inner code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;font-family:'Roboto Mono',monospace;font-size:12px;color:var(--pink)}
.faq-a-inner a{color:var(--pink);text-decoration:none}

/* Цветной ползунок внизу */
.hue-wrap{margin-top:24px}
.footer-info{margin-top:28px;text-align:center;font-size:11px;color:var(--dim);font-family:'Roboto Mono',monospace;letter-spacing:.05em}
.footer-info a{color:var(--pink);text-decoration:none}
</style>
</head>
<body class="theme-wine hide-header-btns">
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="logo">❓</div>
      <div>
        <div class="bname">FAQ</div>
        <div class="bsub">вопросы</div>
      </div>
    </div>
    <div class="me"><span id="meE">🦊</span> <span id="meN">—</span></div>
  </div>

  <div class="slabel">Частые вопросы</div>

  <div id="faqList"></div>

  <div class="hue-wrap">
    <div class="hue-title"><span>🎨 ЦВЕТ ПРИЛОЖЕНИЯ</span><span class="hue-bubble" id="hueBubble"></span></div>
    <input type="range" min="0" max="360" step="1" class="hue-slider" id="hueSlider">
    <div class="hue-hint">двигай → цвет меняется вживую</div>
  </div>

  <div class="footer-info">
    Тепло · <a href="https://t.me/aSp1rit" target="_blank" rel="noopener">by @aSp1rit</a>
  </div>
</div>

<script src="/bg-anim.js"></script>
<script src="/theme.js?v=1790963082"></script>
<script src="/tabbar.js?v=1790963082"></script>
<script>
const FAQ = [
  {
    e: '💚',
    q: 'Что такое Тепло?',
    a: 'Это маленькое приложение для пар. Ты можешь отправлять близкому человеку тёплые сообщения, рисунки и фото — они приходят прямо в Telegram. А ещё у вас есть <b>серия дней</b>, которую вы держите вместе 🔥'
  },
  {
    e: '🔗',
    q: 'Как начать пользоваться?',
    a: 'Открой свою <b>персональную ссылку</b> — она выглядит как <code>.../?token=xxxx</code>. После первого входа ссылка сохранится в браузере, и ты сможешь заходить просто по адресу сайта. Для установки на телефон — «Добавить на главный экран».'
  },
  {
    e: '📱',
    q: 'Как установить приложение на телефон?',
    a: 'В <b>Chrome</b> (Android) — нажми три точки → «Установить приложение». В <b>Safari</b> (iPhone) — кнопка «Поделиться» → «На экран Домой». После установки появится иконка «Тепло» 💕'
  },
  {
    e: '🔥',
    q: 'Что значит огонёк и серия?',
    a: 'Огонёк показывает, сколько дней <b>подряд</b> вы заходите и отмечаетесь. Нажми кнопку <b>«Отметить день»</b> раз в сутки — серия растёт. Если пропустишь день — серия сгорает и придётся начинать заново.'
  },
  {
    e: '🏆',
    q: 'Как получить достижения?',
    a: 'Достижения открываются автоматически за длинные серии: <b>5 дней</b> — 🥉 Начало пути, <b>10</b> — 🥈 Первая десятка, <b>30</b> — 🥇 Месяц силы, <b>100</b> — 💎 Легенда. Когда получаешь новое — приходит уведомление в Telegram.'
  },
  {
    e: '😈',
    q: 'Что за «наказания»?',
    a: 'Если один из вас пропустил день и серия сгорела — другой может <b>назначить наказание</b>. Введи любой текст (например, «помыть посуду») — и прогульщику придёт уведомление в Telegram с этим заданием 😄'
  },
  {
    e: '🎨',
    q: 'Как поменять цвет приложения?',
    a: 'Прокрути главную вниз — там <b>радужный ползунок</b> «Цвет приложения». Двигай — весь сайт перекрашивается в реальном времени. Выбор сохраняется автоматически. То же — на этой странице внизу.'
  },
  {
    e: '✏️',
    q: 'Можно добавить свои кнопки?',
    a: 'Да! Открой <b>⚙️ Настройки → 👤 Профиль</b>. Там можно поменять имя, emoji и создать <b>свои кнопки</b> — с эмодзи, названием, текстом и цветом. Они появятся на главной над стандартными.'
  },
  {
    e: '🎮',
    q: 'Что за вкладка «Игры»?',
    a: 'Там игра <b>«Загадка»</b> — ты создаёшь квиз с вопросами о себе, а партнёр проходит и получает результат. Создаёшь в один тап, ответы видит только после прохождения.'
  },
  {
    e: '🔔',
    q: 'Не приходят уведомления, что делать?',
    a: 'Проверь: 1) написал ли партнёр боту <code>/start</code>; 2) тот ли аккаунт используется. Если ничего не помогает — напиши автору в Telegram: <a href="https://t.me/aSp1rit" target="_blank">@aSp1rit</a>'
  },
  {
    e: '💸',
    q: 'Это бесплатно?',
    a: 'Да, полностью. Проект сделан с любовью — <b>ради идеи, а не ради денег</b>. Если захочешь поддержать — просто расскажи друзьям 💚'
  },
  {
    e: '👨‍💻',
    q: 'Кто автор?',
    a: 'Сделал <b>@aSp1rit</b> — с помощью современного веб-стека: Node.js, Telegram Bot API, Render, JSONBin. Если найдёшь баг или есть идея — <a href="https://t.me/aSp1rit" target="_blank">напиши в Telegram</a>.'
  }
];

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

function render(){
  const box = document.getElementById('faqList');
  box.innerHTML = '';
  FAQ.forEach(function(item, i){
    const el = document.createElement('div');
    el.className = 'faq-item';
    el.innerHTML = 
      '<button class="faq-q">' +
        '<span class="q-emoji">' + item.e + '</span>' +
        '<span class="q-text">' + esc(item.q) + '</span>' +
        '<span class="q-arrow">▼</span>' +
      '</button>' +
      '<div class="faq-a"><div class="faq-a-inner">' + item.a + '</div></div>';
    el.querySelector('.faq-q').onclick = function(){
      el.classList.toggle('open');
    };
    box.appendChild(el);
  });
}

function initUser(){
  const t = localStorage.getItem('teplo_token_v1');
  if (!t) return;
  fetch('/api/me?token=' + encodeURIComponent(t))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.user) {
        document.getElementById('meE').textContent = d.user.emoji;
        document.getElementById('meN').textContent = d.user.name;
      }
    })
    .catch(function(){});
}

render();
initUser();
</script>
<script src="/visual.js?v=1790980043"></script></body>
</html>
